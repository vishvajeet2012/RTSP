name: checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm test && npm run build
      - run: go vet ./... && go test -race ./... && go build ./cmd/server
        working-directory: backend
      - run: docker compose config --quiet && docker compose build
      - run: docker build -f backend/Dockerfile.demo -t rtsp-viewer-demo .
      - run: docker compose up -d mediamtx test-publisher test-publisher-2
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npx playwright install --with-deps chromium
      - run: TEST_RTSP_URL=rtsp://localhost:8554/test go test -race ./...
        working-directory: backend
      - run: npm run test:e2e
        env:
          TEST_RTSP_URL: rtsp://localhost:8554/test
          TEST_RTSP_URL_2: rtsp://localhost:8554/test2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            test-results
            docs/*.png
      - run: docker compose down
        if: always()
